services:
  experiment:
    build: .
    image: deep-feat-selection
    # Bind mounts rather than named volumes, so results land in the working
    # tree where they can actually be inspected.
    volumes:
      - ./Data:/app/Data:ro
      - ./ExpOutput:/app/ExpOutput
    command: ["--n-models", "20", "--outdir", "/app/ExpOutput"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # `docker compose run cpu --n-models 20` for machines without a GPU.
  cpu:
    build: .
    image: deep-feat-selection
    environment:
      CUDA_VISIBLE_DEVICES: "-1"
    volumes:
      - ./Data:/app/Data:ro
      - ./ExpOutput:/app/ExpOutput
    command: ["--n-models", "20", "--outdir", "/app/ExpOutput"]
